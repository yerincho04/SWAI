<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Hub — 프랜차이즈 탐색 시작</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="templatemo-glass-admin-style.css">
    <style>
        html, body { height: 100%; margin: 0; }

        .wizard-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            position: relative;
            z-index: 1;
        }

        /* Top-right controls */
        .wizard-top-bar {
            position: fixed; top: 20px; right: 24px;
            display: flex; align-items: center; gap: 10px; z-index: 200;
        }

        /* Logo */
        .wizard-logo {
            display: flex; align-items: center; gap: 10px; margin-bottom: 32px;
        }
        .wizard-logo-icon {
            width: 40px; height: 40px; background: var(--emerald);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 1.1rem;
        }
        .wizard-logo-text { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }

        /* Step Trail */
        .step-trail {
            display: flex; align-items: center; gap: 6px; margin-bottom: 40px;
        }
        .step-trail-item {
            display: flex; align-items: center; gap: 7px;
            font-size: 0.82rem; color: var(--text-muted);
        }
        .step-trail-item.active { color: var(--emerald); font-weight: 600; }
        .step-trail-num {
            width: 22px; height: 22px; border-radius: 50%;
            border: 1.5px solid currentColor; display: flex; align-items: center;
            justify-content: center; font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
        }
        .step-trail-item.active .step-trail-num {
            background: var(--emerald); border-color: var(--emerald); color: #fff;
        }
        .step-trail-sep { color: var(--glass-border); font-size: 0.85rem; margin: 0 2px; }

        /* Wizard Card */
        .wizard-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 44px 48px;
            max-width: 580px; width: 100%;
            box-shadow: 0 32px 80px rgba(0,0,0,0.1);
        }
        .wizard-kicker {
            display: block; font-size: 0.75rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--emerald); margin-bottom: 12px;
        }
        .wizard-card h1 {
            font-size: 1.65rem; font-weight: 700; line-height: 1.3;
            margin: 0 0 10px;
        }
        .wizard-card .wizard-intro {
            color: var(--text-secondary); font-size: 0.93rem; margin-bottom: 36px;
        }

        /* Sections */
        .wizard-section { margin-bottom: 28px; }
        .wizard-section-title {
            font-size: 0.88rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;
        }
        .wizard-section-hint {
            font-size: 0.78rem; color: var(--text-muted); margin-bottom: 12px;
        }
        .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }

        /* Chips */
        .wchip {
            padding: 8px 18px; border-radius: 24px; font-size: 0.875rem;
            border: 1.5px solid var(--glass-border); background: transparent;
            color: var(--text-primary); cursor: pointer;
            transition: all 0.18s; font-family: inherit; line-height: 1.2;
        }
        .wchip:hover { border-color: var(--emerald); color: var(--emerald); }
        .wchip.selected { background: var(--emerald); border-color: var(--emerald); color: #fff; }
        .wchip.budget.selected { background: #6366f1; border-color: #6366f1; color: #fff; }
        .wchip.budget:hover:not(.selected) { border-color: #6366f1; color: #6366f1; }

        /* Actions */
        .wizard-actions { margin-top: 36px; display: flex; flex-direction: column; gap: 10px; }
        .wizard-cta {
            width: 100%; padding: 14px 24px; border-radius: 12px;
            background: var(--emerald); color: #fff;
            font-size: 1rem; font-weight: 600; border: none; cursor: pointer;
            font-family: inherit; transition: opacity 0.2s;
        }
        .wizard-cta:hover { opacity: 0.88; }
        .wizard-skip {
            background: none; border: none; color: var(--text-muted);
            font-size: 0.85rem; cursor: pointer; font-family: inherit;
            padding: 4px; text-align: center;
        }
        .wizard-skip:hover { color: var(--text-secondary); text-decoration: underline; }

        /* Scrollable budget presets row */
        .budget-presets-row {
            display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px;
            padding-bottom: 8px; margin-bottom: 14px;
            scrollbar-width: thin; scrollbar-color: var(--glass-border) transparent;
        }
        .budget-presets-row .wchip { flex-shrink: 0; }

        /* Dual range slider */
        .dual-range-wrap { margin: 4px 0 6px; }
        .dual-range-slider {
            position: relative; height: 32px;
            display: flex; align-items: center; margin-bottom: 4px;
        }
        .slider-track {
            position: absolute; width: 100%; height: 4px;
            background: var(--glass-border); border-radius: 2px; pointer-events: none;
        }
        .slider-fill {
            position: absolute; height: 4px; background: #6366f1;
            border-radius: 2px; pointer-events: none; left: 0%; width: 100%;
        }
        .slider-thumb {
            position: absolute; width: 100%; height: 0;
            -webkit-appearance: none; appearance: none;
            background: transparent; pointer-events: none;
            outline: none; margin: 0; padding: 0;
        }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 20px; height: 20px; border-radius: 50%;
            background: #fff; border: 2.5px solid #6366f1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18); cursor: pointer;
            pointer-events: all; transition: transform 0.12s, box-shadow 0.12s;
        }
        .slider-thumb::-webkit-slider-thumb:hover { transform: scale(1.18); box-shadow: 0 3px 12px rgba(99,102,241,0.3); }
        .slider-thumb::-moz-range-thumb {
            width: 20px; height: 20px; border-radius: 50%;
            background: #fff; border: 2.5px solid #6366f1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18); cursor: pointer; pointer-events: all;
        }
        .slider-labels {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.82rem; margin-top: 6px; gap: 8px;
        }
        .slider-val { font-weight: 700; color: #6366f1; }
        .slider-sep { color: var(--text-muted); flex-shrink: 0; }
        .slider-none { color: var(--text-muted); font-weight: 400; }

        /* Loading */
        .chips-loading { font-size: 0.85rem; color: var(--text-muted); padding: 8px 0; }

        @media (max-width: 640px) {
            .wizard-card { padding: 28px 24px; }
            .wizard-card h1 { font-size: 1.35rem; }
            .step-trail-item span:not(.step-trail-num) { display: none; }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="wizard-top-bar">
        <button class="nav-btn" id="theme-toggle" title="Toggle Light/Dark Mode">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2"/><path d="M12 20v2"/>
                <path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/>
                <path d="M2 12h2"/><path d="M20 12h2"/>
                <path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </div>

    <div class="wizard-page">
        <div class="wizard-logo">
            <div class="wizard-logo-icon">B</div>
            <span class="wizard-logo-text">Brand Hub</span>
        </div>

        <div class="step-trail">
            <div class="step-trail-item active">
                <span class="step-trail-num">1</span>
                <span>관심 설정</span>
            </div>
            <span class="step-trail-sep">——</span>
            <div class="step-trail-item">
                <span class="step-trail-num">2</span>
                <span>브랜드 탐색</span>
            </div>
            <span class="step-trail-sep">——</span>
            <div class="step-trail-item">
                <span class="step-trail-num">3</span>
                <span>AI 상담</span>
            </div>
        </div>

        <div class="wizard-card">
            <span class="wizard-kicker">Step 1 · 관심 설정</span>
            <h1>어떤 프랜차이즈를<br>찾고 계신가요?</h1>
            <p class="wizard-intro">관심 업종과 예산을 고르면 딱 맞는 브랜드만 추려드립니다.<br>건너뛰면 전체 브랜드를 볼 수 있습니다.</p>

            <div class="wizard-section">
                <div class="wizard-section-title">관심 업종</div>
                <div class="wizard-section-hint">복수 선택 가능 · 선택 안 하면 전체 업종 표시</div>
                <div class="chip-grid" id="category-chips">
                    <span class="chips-loading">업종 목록 불러오는 중...</span>
                </div>
            </div>

            <div class="wizard-section">
                <div class="wizard-section-title">창업 예산</div>
                <div class="wizard-section-hint">빠른 선택 또는 슬라이더로 직접 설정 (단위: 만원)</div>

                <!-- Scrollable preset chips -->
                <div class="budget-presets-row" id="budget-chips">
                    <button class="wchip budget" data-min="0" data-max="5000">5천만 미만</button>
                    <button class="wchip budget" data-min="5000" data-max="10000">5천만~1억</button>
                    <button class="wchip budget" data-min="10000" data-max="20000">1억~2억</button>
                    <button class="wchip budget" data-min="20000" data-max="30000">2억~3억</button>
                    <button class="wchip budget" data-min="30000" data-max="50000">3억~5억</button>
                    <button class="wchip budget" data-min="50000" data-max="100000">5억~10억</button>
                    <button class="wchip budget" data-min="100000" data-max="999999">10억 이상</button>
                </div>

                <!-- Dual range slider -->
                <div class="dual-range-wrap">
                    <div class="dual-range-slider">
                        <div class="slider-track">
                            <div class="slider-fill" id="slider-fill"></div>
                        </div>
                        <input type="range" class="slider-thumb" id="slider-min"
                               min="0" max="100000" step="1000" value="0">
                        <input type="range" class="slider-thumb" id="slider-max"
                               min="0" max="100000" step="1000" value="100000">
                    </div>
                    <div class="slider-labels">
                        <span id="slider-min-label" class="slider-none">제한 없음</span>
                        <span class="slider-sep">~</span>
                        <span id="slider-max-label" class="slider-none">제한 없음</span>
                    </div>
                </div>
            </div>

            <div class="wizard-actions">
                <button class="wizard-cta" id="start-btn">추천 브랜드 보기 →</button>
                <button class="wizard-skip" id="skip-btn">필터 없이 전체 브랜드 보기</button>
            </div>
        </div>
    </div>

    <script src="app-config.js"></script>
    <script src="templatemo-glass-admin-script.js"></script>
    <script>
    (function () {
        const BRAND_MASTER_URLS = [
            './data/brand_master.json',
            '../db_chatbot/build_api_selected/brand_master.json',
            '/db_chatbot/build_api_selected/brand_master.json',
            `${window.location.origin}/db_chatbot/build_api_selected/brand_master.json`
        ];

        async function fetchJsonWithFallback(urls) {
            for (const url of urls) {
                try {
                    const r = await fetch(url);
                    if (r.ok) return await r.json();
                } catch (_) {}
            }
            throw new Error('브랜드 데이터를 불러오지 못했습니다.');
        }

        async function loadCategories() {
            try {
                const master = await fetchJsonWithFallback(BRAND_MASTER_URLS);
                const cats = [...new Set(master.map(b => b.category_main).filter(Boolean))].sort();
                const container = document.getElementById('category-chips');
                container.innerHTML = '';
                cats.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'wchip';
                    btn.textContent = cat;
                    btn.addEventListener('click', () => btn.classList.toggle('selected'));
                    container.appendChild(btn);
                });
            } catch (e) {
                document.getElementById('category-chips').innerHTML =
                    '<span class="chips-loading">업종 목록을 불러오지 못했습니다. 전체 보기를 이용해 주세요.</span>';
            }
        }

        /* ── Budget Slider ── */
        const BUDGET_MAX = 100000; // 100,000만원 = 10억
        const sliderMin = document.getElementById('slider-min');
        const sliderMax = document.getElementById('slider-max');
        const sliderFill = document.getElementById('slider-fill');
        const sliderMinLbl = document.getElementById('slider-min-label');
        const sliderMaxLbl = document.getElementById('slider-max-label');

        function fmtManwon(v) {
            if (v <= 0) return '0원';
            const eok = Math.floor(v / 10000);
            const man = v % 10000;
            const parts = [];
            if (eok > 0) parts.push(`${eok}억`);
            if (man > 0) parts.push(`${man.toLocaleString('ko-KR')}만`);
            return parts.join(' ') + '원';
        }

        function updateSlider() {
            const lo = Number(sliderMin.value);
            const hi = Number(sliderMax.value);
            sliderFill.style.left = (lo / BUDGET_MAX * 100) + '%';
            sliderFill.style.width = ((hi - lo) / BUDGET_MAX * 100) + '%';

            if (lo === 0) {
                sliderMinLbl.textContent = '제한 없음';
                sliderMinLbl.className = 'slider-none';
            } else {
                sliderMinLbl.textContent = fmtManwon(lo);
                sliderMinLbl.className = 'slider-val';
            }
            if (hi >= BUDGET_MAX) {
                sliderMaxLbl.textContent = '제한 없음';
                sliderMaxLbl.className = 'slider-none';
            } else {
                sliderMaxLbl.textContent = fmtManwon(hi);
                sliderMaxLbl.className = 'slider-val';
            }
        }

        sliderMin.addEventListener('input', () => {
            if (Number(sliderMin.value) > Number(sliderMax.value)) sliderMin.value = sliderMax.value;
            updateSlider();
            document.querySelectorAll('#budget-chips .wchip').forEach(b => b.classList.remove('selected'));
        });
        sliderMax.addEventListener('input', () => {
            if (Number(sliderMax.value) < Number(sliderMin.value)) sliderMax.value = sliderMin.value;
            updateSlider();
            document.querySelectorAll('#budget-chips .wchip').forEach(b => b.classList.remove('selected'));
        });

        // Preset chip click → update slider, keep chip highlighted
        document.querySelectorAll('#budget-chips .wchip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#budget-chips .wchip').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                sliderMin.value = Math.min(Number(btn.dataset.min), BUDGET_MAX);
                sliderMax.value = Math.min(Number(btn.dataset.max), BUDGET_MAX);
                updateSlider();
            });
        });

        updateSlider(); // init fill

        function readBudgetPrefs() {
            const lo = Number(sliderMin.value);
            const hi = Number(sliderMax.value);
            const budgetMin = lo === 0 ? null : lo;
            const budgetMax = hi >= BUDGET_MAX ? null : hi;
            const label = budgetMin == null && budgetMax == null ? null
                : budgetMin == null ? `${fmtManwon(budgetMax)} 이하`
                : budgetMax == null ? `${fmtManwon(budgetMin)} 이상`
                : `${fmtManwon(budgetMin)}~${fmtManwon(budgetMax)}`;
            return { budgetMin, budgetMax, label };
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            const cats = [...document.querySelectorAll('#category-chips .wchip.selected')].map(b => b.textContent.trim());
            const { budgetMin, budgetMax, label: budgetLabel } = readBudgetPrefs();
            const prefs = {
                categories: cats,
                budgetMin,
                budgetMax,
                label: [cats.length ? cats.join(', ') : null, budgetLabel].filter(Boolean).join(' · ')
            };
            localStorage.setItem('brandhub_prefs', JSON.stringify(prefs));
            localStorage.setItem('brandhub_onboarded', '1');
            window.location.href = 'brands.html';
        });

        document.getElementById('skip-btn').addEventListener('click', () => {
            localStorage.removeItem('brandhub_prefs');
            localStorage.setItem('brandhub_onboarded', '1');
            window.location.href = 'brands.html';
        });

        loadCategories();
    })();
    </script>
</body>
</html>
