<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 브랜드 상담 — Brand Hub</title>
    <meta name="description" content="AI에게 프랜차이즈 브랜드에 대해 물어보세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="templatemo-glass-admin-style.css">
    <style>
        /* --- Sidebar Nav --- */
        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; padding: 0 12px; margin-top: 8px; }
        .sidebar-nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: 10px; font-size: 0.875rem;
            color: var(--text-secondary); text-decoration: none; transition: all 0.2s;
        }
        .sidebar-nav-item:hover { background: var(--glass-border); color: var(--text-primary); }
        .sidebar-nav-item.active { background: var(--emerald); color: #fff; }
        .sidebar-nav-item svg { flex-shrink: 0; }

        /* --- Chat Layout --- */
        .chat-layout { display: flex; flex-direction: column; gap: 20px; }

        /* --- Brand Selector --- */
        .brand-selector-row {
            display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;
        }
        .brand-select-group { flex: 1; min-width: 180px; }
        .brand-select-group label {
            display: block; font-size: 0.82rem; font-weight: 600;
            color: var(--text-secondary); margin-bottom: 8px;
        }
        .brand-filter-input, .brand-select {
            width: 100%; padding: 10px 14px;
            border-radius: 10px; border: 1.5px solid var(--glass-border);
            background: var(--glass-bg); color: var(--text-primary);
            font-size: 0.9rem; font-family: inherit; outline: none;
            box-sizing: border-box; transition: border-color 0.2s;
        }
        .brand-filter-input:focus, .brand-select:focus { border-color: var(--emerald); }
        .brand-select { cursor: pointer; }

        .selected-brand-pill {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--emerald); color: #fff; border-radius: 20px;
            padding: 5px 14px; font-size: 0.85rem; font-weight: 500;
        }

        /* --- Chat Panel --- */
        .chat-main-card .chatbot-messages {
            min-height: 340px; max-height: 500px;
        }

        /* --- Saved Brand Quick-Pick --- */
        .saved-brands-row {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
        }
        .saved-brands-label {
            font-size: 0.78rem; color: var(--text-muted); width: 100%; margin-bottom: 2px;
        }
        .saved-brand-chip {
            padding: 5px 12px; border-radius: 16px; font-size: 0.82rem; cursor: pointer;
            border: 1.5px solid var(--coral); color: var(--coral); background: transparent;
            transition: all 0.2s;
        }
        .saved-brand-chip:hover { background: var(--coral); color: #fff; }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="dashboard dashboard-single">
        <aside class="sidebar sidebar-single" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">B</div>
                <span class="logo-text">Brand Hub</span>
            </div>

            <nav class="sidebar-nav">
                <a class="sidebar-nav-item" href="index.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    브랜드 탐색
                </a>
                <a class="sidebar-nav-item active" href="chat.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    AI 상담
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="single-highlight-card">
                    <span>Model</span>
                    <strong>GPT-4.1 mini</strong>
                </div>
                <div class="single-highlight-card" style="margin-top:8px;">
                    <span>Source</span>
                    <strong>공정위 가맹 공개정보</strong>
                </div>
            </div>
        </aside>

        <main class="main-content main-content-single">
            <nav class="navbar">
                <div class="page-header">
                    <h1 class="page-title">AI 브랜드 상담</h1>
                </div>
                <div class="navbar-right">
                    <a class="card-btn" href="index.html">← 브랜드 탐색기</a>
                    <button class="nav-btn" id="theme-toggle" title="Toggle Light/Dark Mode">
                        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2"/><path d="M12 20v2"/>
                            <path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/>
                            <path d="M2 12h2"/><path d="M20 12h2"/>
                            <path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/>
                        </svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
            </nav>

            <section class="brand-hub">
                <div class="chat-layout">

                    <!-- Brand Selector -->
                    <section class="glass-card" style="padding:24px;">
                        <div class="panel-heading" style="margin-bottom:16px;">
                            <div>
                                <h2 class="card-title">브랜드 선택</h2>
                                <p class="card-subtitle">분석할 브랜드를 선택하면 AI가 해당 데이터 기반으로 답변합니다.</p>
                            </div>
                            <div id="selected-brand-display"></div>
                        </div>

                        <div class="brand-selector-row">
                            <div class="brand-select-group">
                                <label for="brand-filter-input">브랜드 검색</label>
                                <input type="text" id="brand-filter-input" class="brand-filter-input" placeholder="이름 또는 업종으로 필터...">
                            </div>
                            <div class="brand-select-group" style="flex:2;">
                                <label for="brand-select">브랜드 선택</label>
                                <select id="brand-select" class="brand-select">
                                    <option value="">브랜드를 선택해 주세요</option>
                                </select>
                            </div>
                        </div>

                        <!-- Saved brands quick-pick -->
                        <div id="saved-brands-row" class="saved-brands-row" style="display:none;">
                            <span class="saved-brands-label">저장한 브랜드</span>
                        </div>
                    </section>

                    <!-- Chatbot -->
                    <section class="glass-card chatbot-panel chat-main-card">
                        <div class="panel-heading">
                            <div>
                                <h2 class="card-title">AI 브랜드 분석</h2>
                                <p class="card-subtitle" id="chatbot-subtitle">브랜드를 선택한 뒤 질문을 보내면 AI가 데이터를 기반으로 답변합니다.</p>
                            </div>
                            <span class="chatbot-status" id="chatbot-status">준비 중</span>
                        </div>

                        <div class="chatbot-messages" id="chatbot-messages">
                            <div class="chatbot-message bot">
                                <p>위에서 브랜드를 선택한 뒤 질문을 보내주세요.<br>점포 수 추이, 창업 비용, 운영 안정성 등 무엇이든 물어보세요.</p>
                            </div>
                        </div>

                        <div class="chatbot-prompts">
                            <button class="card-btn prompt-btn" type="button" data-prompt="최근 점포 수 추이를 요약해줘">최근 추이 요약</button>
                            <button class="card-btn prompt-btn" type="button" data-prompt="창업 비용 관점에서 설명해줘">창업 비용 설명</button>
                            <button class="card-btn prompt-btn" type="button" data-prompt="운영 안정성 관점에서 평가해줘">운영 안정성 평가</button>
                            <button class="card-btn prompt-btn" type="button" data-prompt="이 브랜드의 장단점을 요약해줘">장단점 요약</button>
                        </div>

                        <form class="chatbot-form" id="chatbot-form">
                            <textarea id="chatbot-input" placeholder="예: 이 브랜드의 폐점률과 매출을 같이 설명해줘" rows="3"></textarea>
                            <div class="chatbot-actions">
                                <button class="btn btn-primary" id="chatbot-send" type="submit" style="width:auto;">질문하기</button>
                            </div>
                        </form>
                    </section>

                </div>
            </section>
        </main>
    </div>

    <button class="mobile-menu-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>

    <script src="app-config.js"></script>
    <script src="templatemo-glass-admin-script.js"></script>
    <script>
    (function () {
        const BRAND_MASTER_URLS = [
            './data/brand_master.json',
            '../db_chatbot/build_api_selected/brand_master.json',
            '/db_chatbot/build_api_selected/brand_master.json',
            `${window.location.origin}/db_chatbot/build_api_selected/brand_master.json`
        ];
        const CHAT_API_URL = (window.APP_CONFIG && window.APP_CONFIG.chatApiUrl)
            ? window.APP_CONFIG.chatApiUrl
            : 'http://127.0.0.1:8001/api/chat';

        const state = {
            brands: [],
            selectedBrand: null,
            filterText: ''
        };

        const els = {
            brandFilterInput: document.getElementById('brand-filter-input'),
            brandSelect: document.getElementById('brand-select'),
            selectedBrandDisplay: document.getElementById('selected-brand-display'),
            savedBrandsRow: document.getElementById('saved-brands-row'),
            chatbotMessages: document.getElementById('chatbot-messages'),
            chatbotSubtitle: document.getElementById('chatbot-subtitle'),
            chatbotStatus: document.getElementById('chatbot-status'),
            chatbotForm: document.getElementById('chatbot-form'),
            chatbotInput: document.getElementById('chatbot-input')
        };

        async function fetchJsonWithFallback(urls) {
            let lastError = null;
            for (const url of urls) {
                try {
                    const r = await fetch(url);
                    if (!r.ok) { lastError = new Error(`${r.status} at ${url}`); continue; }
                    return await r.json();
                } catch (e) { lastError = e; }
            }
            throw lastError || new Error('Unable to fetch JSON data.');
        }

        function populateBrandSelect(filterText) {
            const select = els.brandSelect;
            const current = select.value;
            select.innerHTML = '<option value="">브랜드를 선택해 주세요</option>';
            const keyword = (filterText || '').trim().toLowerCase();
            const filtered = keyword
                ? state.brands.filter(b => `${b.brand_name} ${b.category_main || ''}`.toLowerCase().includes(keyword))
                : state.brands;
            filtered.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.brand_id;
                opt.textContent = b.category_main ? `${b.brand_name} · ${b.category_main}` : b.brand_name;
                select.appendChild(opt);
            });
            if (current && filtered.some(b => b.brand_id === current)) select.value = current;
        }

        function renderSavedBrandsRow() {
            const savedIds = JSON.parse(localStorage.getItem('brandhub_saved') || '[]');
            if (savedIds.length === 0) { els.savedBrandsRow.style.display = 'none'; return; }
            const savedBrands = savedIds.map(id => state.brands.find(b => b.brand_id === id)).filter(Boolean);
            if (savedBrands.length === 0) { els.savedBrandsRow.style.display = 'none'; return; }
            els.savedBrandsRow.style.display = 'flex';
            els.savedBrandsRow.innerHTML = `<span class="saved-brands-label">저장한 브랜드</span>`;
            savedBrands.forEach(b => {
                const btn = document.createElement('button');
                btn.className = 'saved-brand-chip';
                btn.textContent = b.brand_name;
                btn.addEventListener('click', () => {
                    els.brandSelect.value = b.brand_id;
                    selectBrand(b.brand_id);
                });
                els.savedBrandsRow.appendChild(btn);
            });
        }

        function selectBrand(brandId) {
            const brand = state.brands.find(b => b.brand_id === brandId);
            state.selectedBrand = brand || null;
            if (brand) {
                els.selectedBrandDisplay.innerHTML = `<span class="selected-brand-pill">♥ ${brand.brand_name}</span>`;
                els.chatbotSubtitle.textContent = `${brand.brand_name} 관련 질문을 보내면 AI가 해당 브랜드 데이터를 기반으로 답변합니다.`;
                els.chatbotStatus.textContent = '준비됨';
                resetChatMessages();
            } else {
                els.selectedBrandDisplay.innerHTML = '';
                els.chatbotSubtitle.textContent = '브랜드를 선택한 뒤 질문을 보내면 AI가 데이터를 기반으로 답변합니다.';
                els.chatbotStatus.textContent = '준비 중';
            }
        }

        function appendChatMessage(role, text) {
            const message = document.createElement('div');
            message.className = `chatbot-message ${role}`;
            message.innerHTML = `<p>${text.replace(/\n/g, '<br>')}</p>`;
            els.chatbotMessages.appendChild(message);
            els.chatbotMessages.scrollTop = els.chatbotMessages.scrollHeight;
            return message;
        }

        function resetChatMessages() {
            els.chatbotMessages.innerHTML = '';
            if (state.selectedBrand) {
                appendChatMessage('bot', `${state.selectedBrand.brand_name}에 대해 궁금한 점을 물어보세요. 예: 점포 수 추이, 창업 비용, 운영 안정성`);
            }
        }

        async function sendChat(query) {
            if (!state.selectedBrand) {
                appendChatMessage('bot', '먼저 위에서 브랜드를 선택해 주세요.');
                els.chatbotMessages.scrollTop = els.chatbotMessages.scrollHeight;
                return;
            }

            appendChatMessage('user', query);
            const loading = appendChatMessage('bot', 'AI가 분석 중입니다...');
            els.chatbotStatus.textContent = 'AI 분석 중...';

            const coldStartTimer = setTimeout(() => {
                loading.innerHTML = '<p>서버가 처음 시작되고 있습니다. 20~30초 정도 기다려 주세요...</p>';
            }, 12000);

            try {
                const response = await fetch(CHAT_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, brand_name: state.selectedBrand.brand_name })
                });
                clearTimeout(coldStartTimer);
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error || 'Chat API request failed.');
                loading.innerHTML = `<p>${String(payload.answer || '답변이 비어 있습니다.').replace(/\n/g, '<br>')}</p>`;
                els.chatbotStatus.textContent = '응답 완료';
            } catch (error) {
                clearTimeout(coldStartTimer);
                loading.innerHTML = `<p>AI 응답에 실패했습니다. 잠시 후 다시 시도해 주세요.<br><small style="color:var(--text-muted)">${error.message}</small></p>`;
                els.chatbotStatus.textContent = '연결 실패';
            }
        }

        async function loadData() {
            try {
                const master = await fetchJsonWithFallback(BRAND_MASTER_URLS);
                state.brands = master.sort((a, b) => (a.brand_name || '').localeCompare(b.brand_name || '', 'ko'));
                populateBrandSelect('');
                renderSavedBrandsRow();

                const params = new URLSearchParams(window.location.search);
                const brandParam = params.get('brand');
                if (brandParam) {
                    els.brandSelect.value = brandParam;
                    selectBrand(brandParam);
                }
            } catch (error) {
                console.error('Failed to load brand data:', error);
                els.chatbotSubtitle.textContent = '브랜드 데이터를 불러오지 못했습니다.';
            }
        }

        els.brandFilterInput.addEventListener('input', (e) => {
            state.filterText = e.target.value;
            populateBrandSelect(state.filterText);
        });

        els.brandSelect.addEventListener('change', (e) => selectBrand(e.target.value));

        els.chatbotForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const query = els.chatbotInput.value.trim();
            if (!query) return;
            els.chatbotInput.value = '';
            await sendChat(query);
        });

        document.querySelectorAll('.prompt-btn').forEach((button) => {
            button.addEventListener('click', () => sendChat(button.dataset.prompt || ''));
        });

        loadData();
    })();
    </script>
</body>
</html>
